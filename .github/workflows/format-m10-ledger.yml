name: Format M10 ledger
on:
  push:
    branches: [m10-m26-company-build]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format ledger and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write docs/evaluation/company-build-m10-m26.md
          rm .github/workflows/format-m10-ledger.yml
          npx prettier --check docs/evaluation/company-build-m10-m26.md
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(m10): format company-build execution ledger"
          git push origin HEAD:m10-m26-company-build

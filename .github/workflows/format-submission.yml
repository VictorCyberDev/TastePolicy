name: Format submission branch
on:
  push:
    branches: [submission-final-experience]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: submission-final-experience
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format submission experience
        run: npx prettier --write src/app/page.tsx src/app/judge/page.tsx src/features/company/TasteBoundaryShowcase.tsx src/features/company/submission.css
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx src/app/judge/page.tsx src/features/company/TasteBoundaryShowcase.tsx src/features/company/submission.css
          git commit -m "style: apply repository prettier formatting"
          git push origin HEAD:submission-final-experience
